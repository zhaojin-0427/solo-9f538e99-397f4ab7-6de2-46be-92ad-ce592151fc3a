services:
  handoff:
    build: .
    image: gauge-handoff:local
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # 复核大包（200 万采样）的内存预算；实现按此上限优化。
          memory: 128M
